applications:
  - name: example-app
    namespace: default
    project: default
    source:
      repoURL: https://github.com/Lichknyaz/example-repo.git
      path: charts/django-app
      targetRevision: main
      helm:
        valueFiles:
          - values.yaml
    destination:
      server: https://kubernetes.default.svc
      namespace: default
    syncPolicy:
      automated:
        prune: true
        selfHeal: true

repositories:
  - name: example-app
    url: https://github.com/Lichknyaz/example-repo.git
    username: ${GITHUB_USER}
    password: ${GITHUB_PAT}

repoConfig:
  insecure: "true"
  enableLfs: "true"

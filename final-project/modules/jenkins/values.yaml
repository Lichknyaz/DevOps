controller:
  admin:
    username: admin
    password: admin123

  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  persistentVolume:
    enabled: true
    storageClass: "ebs-sc"
    size: 10Gi

  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest
    - docker-plugin:latest
    - docker-workflow:latest
    - job-dsl:latest

  serviceAccount:
    name: jenkins-sa
    create: false

  containerEnv:
    - name: GITHUB_USER
      valueFrom:
        secretKeyRef:
          name: github-token
          key: username
    - name: GITHUB_PAT
      valueFrom:
        secretKeyRef:
          name: github-token
          key: password

  JCasC:
    configScripts:
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: github-token
                      username: ${GITHUB_USER}
                      password: ${GITHUB_PAT}
                      description: GitHub PAT
      seed-job: |
        jobs:
          - script: >
              job('seed-job') {
                description('Job to generate pipeline for Django project')
                scm {
                  git {
                    remote {
                      url('https://github.com/Lichknyaz/DevOps.git')
                      credentials('github-token')
                    }
                    branches('*/final-project')
                  }
                }
                steps {
                  dsl {
                    text('''
                      pipelineJob("goit-django-docker") {
                        definition {
                          cpsScm {
                            scm {
                              git {
                                remote {
                                  url("https://github.com/Lichknyaz/DevOps.git")
                                  credentials("github-token")
                                }
                                branches("*/final-project")
                              }
                            }
                            scriptPath("final-project/Jenkinsfile")
                          }
                        }
                      }
                    ''')
                  }
                }
              }
